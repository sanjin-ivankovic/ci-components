# =============================================================================
# auto-tag — compute the next SemVer from Conventional Commits and push the tag.
#
# On a main push, reads the commits since the latest SemVer tag and bumps:
#   `!` / `BREAKING CHANGE:` -> major, `feat:` -> minor, anything else -> patch.
# Cold-start (no matching tag yet) seeds `seed`. Skips cleanly when there are
# no new commits.
#
# Two optional filters stop releases nothing shipped asked for (both empty =
# every commit releases):
#   release_types  types that still earn a patch release, e.g. "fix" or
#                  "fix|perf"; other non-feat, non-breaking commits tag nothing.
#   release_paths  space-separated pathspecs; no tag unless a commit since the
#                  last tag changed one of them, e.g. "templates/".
# The token-authenticated tag push starts a tag pipeline in the consumer repo;
# what runs there stays consumer-side (ci-components publishes a Catalog
# release object).
#
# `tag_prefix` selects the tag scheme: "" for bare Catalog SemVer (`1.2.3`),
# "v" for Go-style tags (`v1.2.3`).
#
# Usage (ci-components itself):
#   include:
#     - component: $CI_SERVER_FQDN/example-org/ci-components/auto-tag@<version>
#       inputs:
#         vault: true
#         release_paths: "templates/"
#
# Secrets: a write_repository token whose role may CREATE protected release
# tags. With `vault: true` it comes from Vault kv/ci/<project name>, field
# release_token (role ci-<project name>); otherwise pass a masked + protected
# CI/CD variable via `token`, as the VARIABLE REFERENCE (single-quoted
# `$NAME`), never a literal value.
# =============================================================================
spec:
  inputs:
    job_name:
      default: "auto-tag"
      description: "Name of the generated job."
    stage:
      default: release
      description: "Stage the job runs in."
    image:
      default: "$CI_IMAGE"
      description: "Image carrying git + bash (defaults to the consumer's $CI_IMAGE variable)."
    tag_prefix:
      default: ""
      description: 'Tag prefix: "" for bare SemVer (CI/CD Catalog), "v" for v-prefixed tags.'
    seed:
      default: "1.0.0"
      description: "First version to tag when no matching SemVer tag exists yet."
    token:
      default: ""
      description: "Variable reference (e.g. $MY_RELEASE_TOKEN) holding the write_repository token that pushes the tag. Unused when vault is true."
    vault:
      type: boolean
      default: false
      description: "Read the token from Vault kv/ci/<project name>, field release_token (role ci-<project name>), instead of the token input. The job must run on a protected branch: Vault refuses any other."
    release_types:
      default: ""
      description: 'Commit types that earn a patch release, as an alternation ("fix|perf"). Empty = any commit.'
    release_paths:
      default: ""
      description: 'Space-separated pathspecs; tag only if a commit since the last tag changed one. Empty = any change.'
    rules:
      type: array
      description: "Full rules: array for the job. Default = main push."
      default:
        - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
---
"$[[ inputs.job_name ]]":
  stage: $[[ inputs.stage ]]
  image: $[[ inputs.image ]]
  # Side-effecting (creates the release tag): never cancel mid-flight.
  interruptible: false
  rules: $[[ inputs.rules ]]
  id_tokens:
    VAULT_ID_TOKEN:
      aud: https://vault.example.com
  variables:
    GIT_DEPTH: "0"   # need full history + all tags to compute the next bump
    VAULT_ADDR: https://vault.example.com:8200
    USE_VAULT: "$[[ inputs.vault ]]"
    GITLAB_TOKEN: $[[ inputs.token ]]
    TAG_PREFIX: "$[[ inputs.tag_prefix ]]"
    SEED_VERSION: "$[[ inputs.seed ]]"
    RELEASE_TYPES: "$[[ inputs.release_types ]]"
    RELEASE_PATHS: "$[[ inputs.release_paths ]]"
  script:
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - git config --global user.name "maintainer"
    - git config --global user.email "maintainer@example.com"
    - git fetch --tags --force
    - |
      if [ "$USE_VAULT" = "true" ]; then
        VAULT_TOKEN="$(printf '%s' "$VAULT_ID_TOKEN" | vault write -field=token auth/jwt/login role="ci-$CI_PROJECT_NAME" jwt=-)"
        export VAULT_TOKEN
        GITLAB_TOKEN="$(vault kv get -mount=kv -field=release_token "ci/$CI_PROJECT_NAME")"
        export GITLAB_TOKEN
      fi
    - |
      set -euo pipefail
      LATEST_TAG=$(git tag -l --sort=-v:refname | grep -E "^${TAG_PREFIX}[0-9]+\.[0-9]+\.[0-9]+$" | head -n1 || true)
      if [ -z "$LATEST_TAG" ]; then
        NEXT="$SEED_VERSION"
        echo "=== no ${TAG_PREFIX}SemVer tag yet; seeding ${TAG_PREFIX}${NEXT} ==="
      else
        echo "=== latest tag: $LATEST_TAG ==="
        MSGS=$(git log "$LATEST_TAG..HEAD" --pretty=format:'%s%n%b' || true)
        if [ -z "$MSGS" ]; then
          echo "=== no commits since $LATEST_TAG; nothing to tag ==="
          exit 0
        fi
        echo "=== commits since $LATEST_TAG: ==="
        git log "$LATEST_TAG..HEAD" --oneline
        if [ -n "$RELEASE_PATHS" ]; then
          # Word-split on purpose: one pathspec per word.
          # shellcheck disable=SC2086
          if [ -z "$(git diff --name-only "$LATEST_TAG" HEAD -- $RELEASE_PATHS)" ]; then
            echo "=== nothing under $RELEASE_PATHS changed since $LATEST_TAG; no release ==="
            exit 0
          fi
        fi
        if echo "$MSGS" | grep -qE '^[a-z]+(\([^)]+\))?!:|BREAKING CHANGE:'; then
          BUMP=major
        elif echo "$MSGS" | grep -qE '^feat(\([^)]+\))?:'; then
          BUMP=minor
        else
          SUBJECTS=$(git log --no-merges "$LATEST_TAG..HEAD" --pretty=format:'%s' || true)
          if [ -n "$RELEASE_TYPES" ] && ! echo "$SUBJECTS" | grep -qE "^(${RELEASE_TYPES})(\([^)]+\))?:"; then
            echo "=== no breaking, feat or ${RELEASE_TYPES} commit since $LATEST_TAG; no release ==="
            exit 0
          fi
          BUMP=patch
        fi
        echo "=== bump type: $BUMP ==="
        VERSION="${LATEST_TAG#"$TAG_PREFIX"}"
        IFS='.' read -r MAJ MIN PAT <<< "$VERSION"
        case "$BUMP" in
          major) MAJ=$((MAJ+1)); MIN=0; PAT=0 ;;
          minor) MIN=$((MIN+1)); PAT=0 ;;
          patch) PAT=$((PAT+1)) ;;
        esac
        NEXT="${MAJ}.${MIN}.${PAT}"
      fi
      echo "=== next tag: ${TAG_PREFIX}${NEXT} ==="
      AUTHED_REMOTE="https://oauth2:${GITLAB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
      git tag "${TAG_PREFIX}${NEXT}" -m "${TAG_PREFIX}${NEXT}"
      git push "$AUTHED_REMOTE" "${TAG_PREFIX}${NEXT}"
      echo "=== pushed ${TAG_PREFIX}${NEXT} — the tag pipeline takes it from here ==="
