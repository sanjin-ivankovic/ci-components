# =============================================================================
# mirror-github — sanitize the repo and force-push it to a public GitHub mirror.
#
# Runs publish_github.py → sanitize_repo.py → verify → gitleaks, then
# force-pushes the sanitized result to the public GitHub mirror over
# HTTPS+PAT. The publish tooling and the shared sanitize-base.yaml are baked
# into ci-base at /opt/ci. The CONSUMER's own .ci/sanitize/sanitize-config.yaml
# (extending the base) drives what is stripped, read via SOURCE_REPO.
#
# Runs on the `mirror` pipeline schedule (SCHEDULE_TYPE == schedule_type).
# Stagger the cron per repo, 10 minutes apart from 04:00 Europe/Berlin
# (argo-apps 04:00 · helm-charts 04:10 · proxmox-infra 04:20 · ci-components
# 04:30 · renovate 04:50 · mcp-plugins 05:00; .ci/schedules.yaml).
#
# Usage:
#   include:
#     - component: $CI_SERVER_FQDN/example-org/ci-components/mirror-github@<version>
#       inputs:
#         repo_name: argo-apps
#
# Secrets: Vault kv/ci/github publish_token with `vault: true` (role
# ci-github), otherwise the $GITHUB_PUBLISH_TOKEN group CI/CD variable.
# =============================================================================
spec:
  inputs:
    job_name:
      default: "mirror:github"
      description: "Name of the generated job."
    stage:
      default: mirror
      description: "Stage the job runs in."
    image:
      default: "$CI_IMAGE"
      description: "Image carrying the /opt/ci publish tooling (defaults to $CI_IMAGE)."
    repo_name:
      description: "The repo's name on GitHub (the mirror destination repo)."
    repo_owner:
      default: maintainer-user
      description: "The GitHub account/org that owns the mirror."
    schedule_type:
      default: mirror
      description: "SCHEDULE_TYPE value that gates this scheduled job."
    vault:
      type: boolean
      default: false
      description: "Read the GitHub token from Vault kv/ci/github (role ci-github) instead of the $GITHUB_PUBLISH_TOKEN variable. The job must run on a protected branch: Vault refuses any other."
---
"$[[ inputs.job_name ]]":
  stage: $[[ inputs.stage ]]
  image: $[[ inputs.image ]]
  # Side-effecting (force-pushes the public mirror): never cancel mid-flight.
  interruptible: false
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $SCHEDULE_TYPE == "$[[ inputs.schedule_type ]]"'
  # Never download earlier jobs' artifacts: the snapshot must contain ONLY the
  # clean clone. A prior-stage artifact dropped into CI_PROJECT_DIR gets
  # published (the renovate runner's debug-log NDJSON leaked this way).
  dependencies: []
  id_tokens:
    VAULT_ID_TOKEN:
      aud: https://vault.example.com
  variables:
    VAULT_ADDR: https://vault.example.com:8200
    USE_VAULT: "$[[ inputs.vault ]]"
    GIT_STRATEGY: clone
    GIT_DEPTH: "0"
    GITHUB_REPO_NAME: $[[ inputs.repo_name ]]
    GITHUB_REPO_OWNER: $[[ inputs.repo_owner ]]
  script:
    - export SOURCE_REPO="$CI_PROJECT_DIR" OUTPUT_REPO=/tmp/publish-output
    - |
      if [ "$USE_VAULT" = "true" ]; then
        VAULT_TOKEN="$(printf '%s' "$VAULT_ID_TOKEN" | vault write -field=token auth/jwt/login role=ci-github jwt=-)"
        export VAULT_TOKEN
        GITHUB_TOKEN="$(vault kv get -mount=kv -field=publish_token ci/github)"
      else
        GITHUB_TOKEN="$GITHUB_PUBLISH_TOKEN"
      fi
      export GITHUB_TOKEN
    - python3 /opt/ci/publish_github.py --verbose
